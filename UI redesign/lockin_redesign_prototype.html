edesign .lk-resource-list a{justify-content:space-between}#lockin-redesign .lk-footer{font-size:8px;letter-spacing:.5px}#lockin-redesign input:not([type=checkbox]):not([type=radio]),#lockin-redesign select,#lockin-redesign textarea{font-size:16px}#lockin-redesign .lk-check{min-height:48px}#lockin-redesign .lk-token button{min-height:44px;min-width:44px}#lockin-redesign .lk-subnav button{flex:1;min-height:44px}#lockin-redesign dialog{padding:22px 19px}}

<script>
(()=>{
const root=document.getElementById('lockin-redesign');if(!root)return;
const main=root.querySelector('#lk-main'),dialog=root.querySelector('#lk-dialog'),notice=root.querySelector('#lk-notice');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const apps=[{id:'steam',name:'Steam',path:'C:\\Program Files (x86)\\Steam\\steam.exe'},{id:'game',name:'Sample game',path:'C:\\Games\\SampleGame\\game.exe'},{id:'discord',name:'Discord',path:'C:\\Users\\Student\\AppData\\Local\\Discord\\Discord.exe'}];
const base={duration:25,mode:'guided',apps:['steam'],sites:[{host:'facebook.com',sub:true},{host:'tiktok.com',sub:true},{host:'reddit.com',sub:true}],terms:['games','gaming','gameplay'],ytMode:'filter',source:'hashtags',unknown:'allow',destination:'home',customUrl:'',tab:'same',hideHome:true,hideShorts:true,hideRelated:true,hideComments:false,hideEnd:true,noAutoplay:true,approved:[],blocked:[],resources:[{label:'MDN Web Docs',url:'https://developer.mozilla.org/'},{label:'JavaScript guide',url:'https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide'}],revision:1};
const profiles=[{...clone(base),id:'coding',name:'Coding study',description:'A clear workspace for code, docs, and tutorials.'},{...clone(base),id:'exam',name:'Exam review',duration:45,description:'Notes first. Only the videos you approve.',ytMode:'approved',resources:[],terms:[],apps:['steam','game']},{...clone(base),id:'reading',name:'Reading',duration:50,description:'Keep your notes close and the feeds quiet.',terms:[],sites:[{host:'facebook.com',sub:true},{host:'tiktok.com',sub:true}],apps:[],resources:[]}];
let s={page:'focus',selected:'coding',duration:25,custom:false,goal:'',phase:'idle',snapshot:null,deadline:0,start:0,countdown:0,early:0,virtualOffset:0,service:true,browser:true,cleanupFail:false,history:[],editor:null,section:'basics',query:'',scenario:'ready',aggregates:true,checking:false,completion:null};
let lastUndo=null, lastView='';
const motionQuery=window.matchMedia('(prefers-reduced-motion: reduce)');
const reduced=()=>motionQuery.matches||root.dataset.motion==='reduced';
function move(el,kind='enter'){
 if(!el||reduced()||!el.animate)return;
 const frames=kind==='digit'?[{opacity:.65,transform:'scale(.97)'},{opacity:1,transform:'scale(1)'}]:kind==='notice'?[{opacity:0,transform:'translateY(-4px)'},{opacity:1,transform:'translateY(0)'}]:[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}];
 el.animate(frames,{duration:kind==='digit'?140:kind==='notice'?180:240,easing:'cubic-bezier(.2,.8,.2,1)'});
}
function syncMotion(){if(reduced())root.getAnimations({subtree:true}).forEach(a=>a.cancel());}
motionQuery.addEventListener('change',syncMotion);
const now=()=>Date.now()+s.virtualOffset;
const current=()=>profiles.find(p=>p.id===s.selected)||profiles[0];
const active=()=>['countdown','active','releasing','cleanup'].includes(s.phase);
const relevant=()=>s.snapshot&&active()?s.snapshot:current();
const hasYoutube=p=>p.ytMode==='approved'||p.terms.length||p.hideHome||p.hideShorts||p.hideRelated||p.hideComments||p.hideEnd||p.noAutoplay;
const needsBrowser=p=>p.sites.length>0||hasYoutube(p);
const time=t=>new Intl.DateTimeFormat('en',{hour:'numeric',minute:'2-digit'}).format(new Date(t));
const clock=seconds=>{seconds=Math.max(0,Math.ceil(seconds));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')};
const btn=(label,action,kind='',extra='')=>`<button type="button" class="lk-btn ${kind}" data-action="${action}" ${extra}>${label}</button>`;
const opt=(value,label,sel)=>`<option value="${esc(value)}" ${value===sel?'selected':''}>${esc(label)}</option>`;
const announce=msg=>{root.querySelector('#lk-announcer').textContent=msg};
function toast(msg,undo=null){lastUndo=undo;notice.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" data-action="undo">Undo</button>':'<button type="button" data-action="dismiss-notice" aria-label="Dismiss notification">Dismiss</button>'}`;notice.hidden=false;move(notice,'notice');}
function modal(title,body){root.querySelector('#lk-dialog-body').innerHTML=`<div class="lk-dialog-head"><h2 id="lk-dialog-title">${title}</h2><button type="button" data-action="close-dialog" aria-label="Close dialog">×</button></div>${body}`;dialog.showModal();move(dialog);}
function destination(p){return ({home:'YouTube Home',focus:'Focus Page',lesson:'an approved lesson',custom:p.customUrl})[p.destination]||'YouTube Home'}
function tabcopy(p){return ({same:'in this tab',existing:'in an existing destination tab',replacement:'in one replacement tab'})[p.tab]}
function resources(p){return `<section class="lk-resources"><div class="lk-between"><h2>Keep the useful things close.</h2>${btn('Edit links','edit-resources','lk-btn-quiet')}</div>${p.resources.length?`<div class="lk-resource-list">${p.resources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label)} <span aria-hidden="true">↗</span><span class="lk-sr"> (opens a new tab)</span></a>`).join('')}</div>`:`<p class="lk-hint">Add your notes, documentation, or an approved lesson to this profile.</p>`}</section>`}
function boundaries(p){const yt=p.ytMode==='approved'?'Approved videos only':p.terms.length?`${p.terms.length} ${p.source==='hashtags'?'hashtag':'title'} rules`:'Surface controls';return `<div class="lk-boundaries"><button type="button" class="lk-boundary" data-action="edit-apps"><span class="lk-category">APPS</span><strong>${p.apps.length} selected ${p.apps.length===1?'app':'apps'} <span aria-hidden="true">↗</span></strong><small>${p.apps.length?p.apps.map(id=>apps.find(a=>a.id===id)?.name).filter(Boolean).join(', '):'No apps selected'}</small></button><button type="button" class="lk-boundary" data-action="edit-sites"><span class="lk-category">WEBSITES</span><strong>${p.sites.length} ${p.sites.length===1?'website':'websites'} <span aria-hidden="true">↗</span></strong><small>${p.sites.length?p.sites.map(r=>r.host).slice(0,2).join(', ')+(p.sites.length>2?` +${p.sites.length-2}`:''):'No websites selected'}</small></button><button type="button" class="lk-boundary" data-action="edit-youtube"><span class="lk-category">YOUTUBE</span><strong>${esc(yt)} <span aria-hidden="true">↗</span></strong><small>${hasYoutube(p)?`Return to ${esc(destination(p))}`:'No YouTube rules selected'}</small></button></div>`}
function header(title,copy=''){return `<div class="lk-intro"><h1>${title}</h1>${copy?`<p>${copy}</p>`:''}</div>`}
function health(){const missing=!s.service?'Desktop unavailable':!s.browser?'Browser disconnected':'Demo connections ready';root.querySelector('#lk-health').textContent=(s.service&&s.browser?'✓ ':'! ')+missing;root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===s.page||s.page==='editor'&&b.dataset.page==='profiles')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});root.querySelectorAll('[data-action=advance],[data-action=finish]').forEach(b=>b.disabled=!['countdown','active'].includes(s.phase));}
function render(){
 const previous=document.activeElement,hadFocus=main.contains(previous),key=previous?.id||'',action=previous?.dataset?.action;
 health();const views={focus:focusPage,profiles:profilesPage,editor:editorPage,history:historyPage,connections:connectionsPage,settings:settingsPage};main.innerHTML=(views[s.page]||focusPage)();tickDisplay();
 const view=s.page+':'+(s.page==='focus'?s.phase:s.page==='editor'?s.section:'');
 if(view!==lastView){move(main);lastView=view;}
 if(hadFocus){let target=key?Array.from(main.querySelectorAll('[id]')).find(el=>el.id===key):null;if(!target&&action)target=Array.from(main.querySelectorAll('[data-action]')).find(el=>el.dataset.action===action);if(!target)target=Array.from(main.querySelectorAll('input,select,button,a[href]')).find(el=>!el.disabled&&el.getClientRects().length);target?.focus({preventScroll:true});}
}
function focusPage(){const p=relevant();if(s.phase==='review')return reviewPage();if(s.phase==='countdown')return `${header('A moment to settle in.','Your session starts after the countdown. You can still cancel.')}<section class="lk-focus-stage"><span class="lk-eyebrow">STARTING SOON · SIMULATION</span><div class="lk-clock" id="lk-countdown" role="timer"></div><h2>${esc(s.snapshot.goal||s.snapshot.name)}</h2><p class="lk-small">No restrictions are applied during this countdown.</p>${btn('Cancel countdown','cancel-countdown','lk-btn-quiet')}</section>${boundaries(s.snapshot)}`;
if(s.phase==='active')return activePage();if(s.phase==='releasing')return `${header('Wrapping up.','Checking that this session’s simulated restrictions are released.')}<div class="lk-panel" role="status" aria-busy="true">Releasing apps and browser rules…</div>`;
if(s.phase==='cleanup')return `${header('One more thing to restore.','The session timer has ended. Browser cleanup is still unconfirmed.')}<div class="lk-error-box"><strong>! Browser rules need another check.</strong><p>App restrictions are released in this simulation. We cannot confirm that the browser rules were removed.</p></div><div class="lk-panel"><h2>Reconnect, then try again.</h2><p class="lk-muted">In the installed app, open the paired browser and check its extension connection. No new session can start until cleanup is verified.</p>${btn('Retry cleanup','retry-cleanup','lk-btn-primary')}${btn('Recovery instructions','recovery','lk-btn-quiet')}</div>`;
if(s.phase==='completed')return completePage();
const ready=s.service&&(!needsBrowser(p)||s.browser);
return `${header('Make room for <em>one thing.</em>','Set your boundaries. Choose your next small step.')}
${!ready?`<div class="lk-error-box"><strong>! ${!s.service?'Desktop connection required.':'Browser connection required.'}</strong><p>${!s.service?'The timer and recovery connection are unavailable.':'This profile includes browser rules. Reconnect before starting.'}</p>${btn('Check connections','connections','lk-btn-quiet')}</div>`:''}
<section class="lk-session" aria-label="Prepare a focus session"><div class="lk-session-form lk-stack"><div><label class="lk-label" for="lk-profile">Your focus profile</label><select id="lk-profile">${profiles.map(x=>opt(x.id,x.name,s.selected)).join('')}</select></div><div><label class="lk-label" for="lk-goal">One thing to work on <span class="lk-muted">· optional</span></label><input id="lk-goal" maxlength="120" placeholder="e.g. Finish my JavaScript lesson" value="${esc(s.goal)}"></div><fieldset><legend class="lk-label">How long do you need?</legend><div class="lk-duration">${[25,45,50,60].map(n=>`<button type="button" data-duration="${n}" aria-pressed="${s.duration===n&&!s.custom}">${n} min</button>`).join('')}<button type="button" data-action="custom-duration" aria-pressed="${s.custom}">Custom</button></div><div class="lk-custom" ${s.custom?'':'hidden'}><label class="lk-label" for="lk-custom-minutes">Minutes · 1 to 480</label><input id="lk-custom-minutes" type="number" min="1" max="480" step="1" value="${s.duration}" aria-describedby="lk-duration-error"><p id="lk-duration-error" class="lk-field-error" hidden></p></div></fieldset><p class="lk-hint">Your selected rules stay fixed for this session.</p></div><aside class="lk-ticket" aria-label="Session preview"><div><span class="lk-eyebrow">A LITTLE TIME, WELL SET ASIDE</span><div class="lk-ticket-time" id="lk-ticket-minutes">${s.duration}<span>min</span></div><p class="lk-ticket-end">Estimated finish <strong id="lk-estimate">${time(now()+s.duration*60000+10000)}</strong><br>Includes the 10-second start countdown.</p></div><div class="lk-ticket-bottom"><span class="lk-mode-label">${p.mode==='guided'?'Guided session':'Committed session'}</span><p class="lk-hint">${p.mode==='guided'?'You can end early after a 60-second wait.':'No ordinary early end. Recovery stays available.'}</p>${btn('Start focus <span aria-hidden="true">→</span>','review','lk-btn-primary lk-wide',!ready?'disabled':'')}<p class="lk-hint">You’ll review everything before it begins.</p></div></aside></section>${boundaries(p)}${resources(p)}`;}
function reviewPage(){const p=current(),ready=s.service&&(!needsBrowser(p)||s.browser),running=p.apps.includes('steam');return `${header('Ready when you are.','Review your boundaries before the 10-second countdown.')}<section class="lk-panel"><div class="lk-between"><h2>${esc(p.name)}</h2><span class="lk-tag">Simulation</span></div><dl class="lk-summary"><dt>Your intention</dt><dd>${esc(s.goal||'One focused session')}</dd><dt>Time</dt><dd>${s.duration} minutes · estimated finish ${time(now()+s.duration*60000+10000)}</dd><dt>Apps</dt><dd>${p.apps.length?'Closes selected apps after launch. It does not prevent launch.':'No app restrictions.'}</dd><dt>Websites</dt><dd>${p.sites.length} selected. Already-open matching sites will be replaced.</dd><dt>YouTube</dt><dd>${hasYoutube(p)?`Pause matched videos → ${esc(destination(p))} ${tabcopy(p)}. The source video will not keep playing.`:'No YouTube restrictions.'}</dd><dt>Ending</dt><dd>${p.mode==='guided'?'Guided · End early after a 60-second wait.':'Committed · No ordinary early end. Use recovery if something breaks.'}</dd></dl><ul class="lk-checks"><li><span>${s.service?'✓':'!'}</span><div>Desktop timer and recovery ${s.service?'ready (sample)':'unavailable'}.</div></li><li><span>${!needsBrowser(p)||s.browser?'✓':'!'}</span><div>${needsBrowser(p)?`Chrome · Study profile ${s.browser?'connected (sample)':'disconnected'}. Private windows and other browser profiles are not covered.`:'This profile does not require browser rules.'}</div></li></ul>${running?`<div class="lk-warning"><strong>Save your work first.</strong><p>Steam is running in this sample scenario. Selected apps may be closed when the session begins.</p><label class="lk-check"><input id="lk-ack" type="checkbox"><span>I’ve saved my work and reviewed app closure.</span></label></div>`:''}${p.mode==='committed'?`<label class="lk-check"><input id="lk-commit-ack" type="checkbox"><span>I understand that ordinary early ending is unavailable.</span></label>`:''}${!ready?'<p class="lk-field-error" role="alert">Required connection missing. Return to Connections to repair it.</p>':''}<p class="lk-field-error" id="lk-review-error" role="alert" hidden></p><div class="lk-actions">${btn('Back','back-idle','lk-btn-quiet')}${btn('Begin countdown','begin','lk-btn-primary',ready?'':'disabled')}</div></section>`;}
function activePage(){const p=s.snapshot,degraded=!s.service||needsBrowser(p)&&!s.browser;return `${header('You’re in your focus space.','Your next small step is the only thing that needs you now.')}${degraded?`<div class="lk-warning"><strong>! ${!s.service?'Desktop connection lost':'Browser coverage is uncertain'}.</strong><p>The original deadline is unchanged. ${!s.browser?'Browser rules may use a cached policy, but current coverage is unconfirmed.':''}</p>${btn('Check connections','connections','lk-btn-quiet')}</div>`:''}<section class="lk-focus-stage" aria-label="Active session"><span class="lk-eyebrow">${esc(p.name)} · ${p.mode.toUpperCase()} · SIMULATION</span><h2>${esc(p.goal||'One thing at a time.')}</h2><div class="lk-clock" id="lk-timer" role="timer" aria-label="Time remaining"></div><p class="lk-small">Time remaining · finishes at ${time(s.deadline)}</p><div class="lk-track" role="progressbar" aria-label="Session elapsed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="lk-progress"></span></div><div class="lk-status-line"><span>${p.apps.length} apps selected</span><span>${p.sites.length} websites</span><span>Revision ${p.revision} fixed</span></div><div class="lk-actions" style="justify-content:center">${btn('Open study resources','open-resources')}</div></section>${s.early?`<div class="lk-warning"><div class="lk-between"><div><strong>Ending in <span id="lk-early-time"></span> seconds</strong><p>Changed your mind? Keep the current session going.</p></div>${btn('Keep focusing','cancel-end')}</div></div>`:p.mode==='guided'?`<div class="lk-between"><p class="lk-hint">Need to stop? Early ending includes a 60-second wait.</p>${btn('End early','request-end','lk-btn-quiet')}</div>`:`<p class="lk-hint">Committed session. If something is broken, Help & recovery is always available.</p>`}<details class="lk-detail"><summary>View this session’s fixed boundaries</summary><dl class="lk-summary"><dt>Apps</dt><dd>${esc(p.apps.map(id=>apps.find(a=>a.id===id)?.name).join(', ')||'None')}</dd><dt>Websites</dt><dd>${esc(p.sites.map(x=>x.host).join(', ')||'None')}</dd><dt>YouTube</dt><dd>${esc(destination(p))} · ${tabcopy(p)}</dd></dl><p class="lk-hint">Editing a profile now changes only your next session.</p>${btn('Edit next session','edit-basics','lk-btn-quiet')}</details>`;}
function completePage(){const c=s.completion||{reason:'Completed',minutes:s.duration};return `${header(c.reason==='Completed'?'A little space, well spent.':c.reason==='Recovered'?'You’re back in control.':'Your session has ended.','The simulated release is complete. Choose what comes next.')}<section class="lk-panel"><span class="lk-tag">✓ ${esc(c.reason)}</span><div class="lk-history-stat">${c.minutes}<small> elapsed session minutes</small></div><p class="lk-muted">${esc(c.name||current().name)} · Apps and sites are available in the simulated state. Nothing is reopened automatically.</p><p class="lk-hint">Elapsed time is session time, not a measurement of learning or attention.</p><div class="lk-actions">${btn('View history','history','lk-btn-quiet')}${btn('Set up another session','new-session','lk-btn-primary')}</div></section>`;}
function profilesPage(){return `<div class="lk-heading-row"><div><h1>Find your rhythm.</h1><p class="lk-muted">A few good boundaries, ready whenever you are.</p></div>${btn('New profile','new-profile','lk-btn-primary')}</div>${active()?'<div class="lk-warning">Your active session stays fixed. Profile changes apply next time.</div>':''}<div class="lk-profile-list">${profiles.map(p=>`<article class="lk-profile"><div class="lk-between"><h2>${esc(p.name)}</h2>${p.id===s.selected?'<span class="lk-tag">Selected</span>':''}</div><p>${esc(p.description||'Your own space to focus.')}</p><span class="lk-small lk-muted">${p.duration} min · ${p.mode==='guided'?'Guided':'Committed'} · ${p.apps.length} apps · ${p.sites.length} websites</span><div class="lk-actions">${btn('Duplicate','duplicate','lk-btn-quiet',`data-id="${esc(p.id)}"`)}${btn('Edit','edit-profile','',`data-id="${esc(p.id)}"`)}${btn(active()?'Use next time':'Use profile','use-profile','lk-btn-primary',`data-id="${esc(p.id)}"`)}</div></article>`).join('')}</div>`;}
function openEditor(section='basics',id=s.selected){s.editor=clone(profiles.find(p=>p.id===id)||current());s.section=section;s.query='';s.page='editor';render();}
function editorPage(){const p=s.editor;return `<div class="lk-heading-row"><div><h1>Your boundaries.</h1><p class="lk-muted">${esc(p.name)}${active()?' · Applies to your next session':''}</p></div>${btn('All profiles','leave-editor','lk-btn-quiet')}</div><nav class="lk-subnav" aria-label="Profile sections">${[['basics','Basics'],['apps','Apps'],['sites','Websites'],['youtube','YouTube'],['resources','Study links']].map(([id,label])=>`<button type="button" data-section="${id}" aria-pressed="${s.section===id}">${label}</button>`).join('')}</nav><div id="lk-editor-fields">${editorFields()}</div><p id="lk-save-error" class="lk-field-error" role="alert" hidden></p><div class="lk-editor-footer"><span class="lk-saved">Draft · ${active()?'next session only':'not saved yet'}</span><div class="lk-inline">${btn('Cancel','leave-editor','lk-btn-quiet')}${btn('Save profile','save-profile','lk-btn-primary')}</div></div>`;}
function selectField(id,label,values,key){return `<div><label class="lk-label" for="${id}">${label}</label><select id="${id}" data-edit="${key}">${values.map(([v,t])=>opt(v,t,s.editor[key])).join('')}</select></div>`}
function toggle(key,label,hint=''){return `<label class="lk-check"><input type="checkbox" data-edit="${key}" ${s.editor[key]?'checked':''}><span>${label}${hint?`<small>${hint}</small>`:''}</span></label>`}
function editorFields(){const p=s.editor;if(s.section==='basics')return `<div class="lk-panel lk-stack"><div><label class="lk-label" for="lk-name">Profile name</label><input id="lk-name" data-edit="name" maxlength="60" value="${esc(p.name)}"></div><div><label class="lk-label" for="lk-default-duration">Default duration · 1 to 480 minutes</label><input id="lk-default-duration" type="number" min="1" max="480" step="1" data-edit="duration" value="${p.duration}"></div>${selectField('lk-mode','Session mode',[['guided','Guided · 60-second early-end wait'],['committed','Committed · no ordinary early end']],'mode')}<p class="lk-hint">Both modes end automatically. Recovery remains available if something breaks. Closing the installed app’s window does not stop the service timer.</p></div>`;
if(s.section==='apps')return `<div class="lk-panel"><h2>Choose the apps to put aside.</h2><p class="lk-muted lk-small">Sample executable identities. In the installed app, select detected apps or browse to an .exe file. Apps are closed after launch.</p><label class="lk-label" for="lk-app-search">Search sample apps</label><input id="lk-app-search" type="search" placeholder="App name or executable" value="${esc(s.query)}"><div id="lk-app-results">${appResults()}</div></div>`;
if(s.section==='sites')return `<div class="lk-panel"><h2>Less feed. More breathing room.</h2><p class="lk-hint">Add domains to block. Study exceptions and path rules are specified in the handoff.</p><div class="lk-form-row" style="margin-top:20px"><div><label class="lk-label" for="lk-site-input">Website domain</label><input id="lk-site-input" placeholder="e.g. instagram.com" aria-describedby="lk-site-error"></div>${btn('Add website','add-site')}</div><label class="lk-check"><input id="lk-subdomains" type="checkbox" checked><span>Include subdomains, such as www</span></label><p id="lk-site-error" class="lk-field-error" role="alert" hidden></p><div>${p.sites.length?p.sites.map((r,i)=>`<div class="lk-row"><div><strong>${esc(r.host)}</strong><p>${r.sub?'Includes subdomains':'This domain only'}</p></div>${btn('Remove','remove-site','lk-btn-quiet',`data-index="${i}" aria-label="Remove ${esc(r.host)}"`)}</div>`).join(''):'<p class="lk-hint">No websites selected. Add a domain above, or keep this profile focused on apps and YouTube.</p>'}</div></div>`;
if(s.section==='resources')return `<div class="lk-panel"><h2>A shortcut to the good stuff.</h2><p class="lk-muted lk-small">Saved links open only when you choose them. Adding a study link does not approve a YouTube video.</p><div class="lk-stack"><div><label class="lk-label" for="lk-link-label">Link label</label><input id="lk-link-label" placeholder="e.g. My course notes" maxlength="80"></div><div><label class="lk-label" for="lk-link-url">HTTPS address</label><input id="lk-link-url" type="url" placeholder="https://…"></div>${btn('Add study link','add-resource','', 'style="align-self:flex-start"')}<p id="lk-resource-error" class="lk-field-error" role="alert" hidden></p></div>${p.resources.map((r,i)=>`<div class="lk-row"><div><strong>${esc(r.label)}</strong><p>${esc(r.url)}</p></div>${btn('Remove','remove-resource','lk-btn-quiet',`data-index="${i}" aria-label="Remove ${esc(r.label)}"`)}</div>`).join('')}</div>`;
return `<div class="lk-stack"><div class="lk-panel lk-stack">${selectField('lk-yt-mode','Which videos are allowed?',[['filter','Filter the distractions I choose'],['approved','Only exact videos I approve']],'ytMode')}<div class="lk-columns">${selectField('lk-source','Match terms in',[['hashtags','Visible hashtags · exact match'],['title','Title · whole words or phrases']],'source')}${selectField('lk-unknown','When the selected metadata is missing',[['allow','Continue with a coverage warning'],['redirect','Redirect after the metadata timeout']],'unknown')}</div><div><label class="lk-label" for="lk-term-input">${p.source==='hashtags'?'Exact hashtag terms':'Title terms'}</label><div class="lk-form-row"><div><input id="lk-term-input" placeholder="${p.source==='hashtags'?'e.g. games':'e.g. gameplay'}" maxlength="70" aria-describedby="lk-term-error"></div>${btn('Add term','add-term')}</div><p id="lk-term-error" class="lk-field-error" role="alert" hidden></p><div class="lk-token-list">${p.terms.map((t,i)=>`<span class="lk-token">${p.source==='hashtags'?'#':''}${esc(t)}<button type="button" data-action="remove-term" data-index="${i}" aria-label="Remove term ${esc(t)}">×</button></span>`).join('')}</div><p class="lk-hint">“games” and “gaming” are separate exact hashtag terms. Creator tags may be unavailable and are not tested here.</p></div><details class="lk-detail"><summary>Exact video exceptions</summary><label class="lk-label" for="lk-approved">Approved video IDs · one per line</label><textarea id="lk-approved" data-edit="approved" rows="3" placeholder="11-character YouTube IDs">${esc(p.approved.join('\n'))}</textarea><label class="lk-label" for="lk-blocked" style="margin-top:15px">Explicitly blocked video IDs · one per line</label><textarea id="lk-blocked" data-edit="blocked" rows="2">${esc(p.blocked.join('\n'))}</textarea><p class="lk-hint">An explicit video block wins over approval. Exact approval wins over a broad term. Approved-only mode denies unresolved videos.</p></details></div><div class="lk-panel lk-stack"><h2>When a distraction matches</h2><div class="lk-columns">${selectField('lk-destination','Return to',[['home','YouTube Home'],['focus','Focus Page'],['lesson','First approved lesson'],['custom','Custom HTTPS address']],'destination')}${selectField('lk-tab','Tab behavior',[['same','Use this tab'],['existing','Switch to an existing destination tab'],['replacement','Open one replacement tab']],'tab')}</div>${p.destination==='custom'?`<div><label class="lk-label" for="lk-custom-url">Approved HTTPS destination</label><input id="lk-custom-url" data-edit="customUrl" value="${esc(p.customUrl)}" placeholder="https://…"></div>`:''}<div class="lk-test-result">Pause the video → ${esc(destination(p))} ${tabcopy(p)}.<br>${p.tab==='existing'?'If no destination tab exists, reuse the current tab. The blocked source is neutralized.':p.tab==='replacement'?'Create the destination first, then close the source. A failure falls back to Focus Page.':'Replace the current page. No extra tab.'}</div><details class="lk-detail"><summary>Quiet the YouTube interface</summary>${toggle('hideHome','Hide Home recommendations')}${toggle('hideShorts','Hide Shorts')}${toggle('hideRelated','Hide related videos')}${toggle('hideComments','Hide comments')}${toggle('hideEnd','Hide end-screen suggestions')}${toggle('noAutoplay','Disable autoplay')}<p class="lk-hint">Search, captions, transcripts, speed controls, and approved study links stay usable.</p></details></div><div class="lk-panel"><h2>Try a rule before you save.</h2><p class="lk-muted lk-small">Uses the sample metadata you enter below. It does not inspect YouTube or redirect a real tab.</p><div class="lk-stack"><div><label class="lk-label" for="lk-test-id">Video ID</label><input id="lk-test-id" value="demoVideo01" maxlength="11"></div><div><label class="lk-label" for="lk-test-title">Video title</label><input id="lk-test-title" value="A weekend of gameplay"></div><div><label class="lk-label" for="lk-test-tags">Visible hashtags</label><input id="lk-test-tags" value="#games #weekend"></div><label class="lk-check"><input id="lk-test-missing" type="checkbox"><span>Selected metadata source is unavailable</span></label>${btn('Test this rule','test-rule','lk-btn-primary','style="align-self:flex-start"')}</div><div id="lk-test-result" role="status" hidden></div></div></div>`;}
function appResults(){let found=apps.filter(a=>(a.name+' '+a.path).toLowerCase().includes(s.query.toLowerCase()));return found.length?found.map(a=>`<label class="lk-check lk-app-option"><input type="checkbox" data-app="${a.id}" ${s.editor.apps.includes(a.id)?'checked':''}><span><strong>${esc(a.name)}</strong><code>${esc(a.path)}</code><small>Sample identity · not verified on your PC</small></span></label>`).join(''):'<p class="lk-hint" role="status">No sample apps match. Try Steam, Discord, or game.</p>'}
function historyPage(){const total=s.history.reduce((a,h)=>a+h.minutes,0);return `${header('Look back, lightly.','A record of your sessions. No scores, streaks, or pressure.')}${!s.history.length?`<div class="lk-empty"><h2>Your next session starts the story.</h2><p>After a simulated session, its duration and outcome appear here. No browsing history is collected.</p>${btn('Set up a session','focus','lk-btn-primary')}</div>`:`<div class="lk-panel"><span class="lk-eyebrow">THIS PROTOTYPE RUN</span><div class="lk-history-stat">${total}<small> elapsed session minutes</small></div><p class="lk-hint">${s.history.length} ${s.history.length===1?'session':'sessions'} · Elapsed time does not measure attention.</p></div><div class="lk-panel">${s.history.map((h,i)=>`<div class="lk-row"><div><strong>${esc(h.name)}</strong><p>${esc(h.reason)} · ${h.minutes} min · ${time(h.at)}</p></div>${btn('Details','history-detail','lk-btn-quiet',`data-index="${i}"`)}</div>`).join('')}</div>`}`;}
function connectionsPage(){return `${header('Know what’s connected.','Coverage belongs to a specific device and browser profile.')}<div class="lk-warning"><strong>Preview environment</strong><p>These are simulated connection states. No Windows service or browser extension is installed by this prototype.</p></div><div class="lk-panel"><div class="lk-row"><div><strong>Desktop timer & recovery</strong><p>${s.service?'✓ Ready in the sample scenario':'! Unavailable — starting is disabled'}</p></div><span class="lk-tag">Simulation</span></div><div class="lk-row"><div><strong>Chrome · Study profile</strong><p>${s.browser?'✓ Paired in the sample scenario':'! Disconnected — current browser coverage is uncertain'}</p></div><span class="lk-tag">Simulation</span></div><div class="lk-row"><div><strong>Private windows & other profiles</strong><p>Not covered. Installation alone does not establish a connection.</p></div></div><div class="lk-actions">${btn(s.checking?'Checking…':'Check connection','check-connection','lk-btn-primary',s.checking?'disabled':'')}</div></div><details class="lk-detail"><summary>How the installed app connects</summary><ol><li>Install the Windows component using the app’s setup.</li><li>Add the companion extension through normal browser controls.</li><li>Pair the intended browser profile and grant only its required permissions.</li><li>Run the one-minute demonstration and verify automatic release.</li></ol><p class="lk-hint">Use Preview controls above to explore a connection failure.</p></details>${active()?btn('Return to session','focus','lk-btn-quiet'):btn('Back to focus','focus','lk-btn-quiet')}`;}
function settingsPage(){return `${header('Make this space yours.','A quiet interface and clear control over what is remembered.')}<div class="lk-panel lk-stack"><div><label class="lk-label" for="lk-theme">Appearance</label><select id="lk-theme">${[['system','Follow system'],['light','Light'],['dark','Dark']].map(([v,t])=>opt(v,t,root.dataset.theme||'system')).join('')}</select></div><div><label class="lk-label" for="lk-motion">Motion</label><select id="lk-motion">${[['system','Follow system · subtle transitions'],['reduced','Reduce motion']].map(([v,t])=>opt(v,t,root.dataset.motion||'system')).join('')}</select><p class="lk-hint">Transitions explain changes. The focus timer stays still. Your system’s reduced-motion preference always takes priority.</p></div><div><label class="lk-check"><input id="lk-aggregates" type="checkbox" ${s.aggregates?'checked':''}><span>Keep session summaries in this prototype<small>Only duration and outcome. Turn off to stop adding new entries.</small></span></label><p class="lk-hint">Detailed browsing events are off. This preview keeps data in memory and resets when reloaded.</p></div></div><div class="lk-panel"><h2>Session history</h2><p class="lk-muted lk-small">Clear only the history created in this preview. Your profiles and active session stay available.</p>${btn('Clear session history','clear-history','lk-btn-danger',s.history.length?'':'disabled')}</div>`;}
function fieldError(id,message){const el=root.querySelector('#'+id);if(el){el.hidden=false;el.textContent=message;const input=el.previousElementSibling;if(input?.matches('input,textarea,select')){input.setAttribute('aria-invalid','true');input.focus();}}}
function validDuration(x){return Number.isInteger(Number(x))&&Number(x)>=1&&Number(x)<=480;}
function safeUrl(value){try{const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password||!u.hostname.includes('.'))return null;return u.href;}catch{return null}}
function validate(p){if(!p.name.trim())return 'Give this profile a name in Basics.';if(!validDuration(p.duration))return 'Choose a whole-number duration from 1 to 480 minutes in Basics.';if([...p.approved,...p.blocked].some(id=>!/^[-\w]{11}$/.test(id)))return 'Use 11-character video IDs in YouTube → Exact video exceptions.';if(p.destination==='custom'&&!safeUrl(p.customUrl))return 'Enter a valid HTTPS destination without embedded credentials.';if(p.destination==='lesson'&&!p.approved.length)return 'Approve at least one exact video before selecting an approved lesson destination.';let host=p.destination==='home'||p.destination==='lesson'?'www.youtube.com':p.destination==='custom'?new URL(p.customUrl).hostname:'';if(host&&p.sites.some(r=>host===r.host||r.sub&&host.endsWith('.'+r.host)))return 'The redirect destination is blocked by a website rule. Remove the conflict or use Focus Page.';return '';}
function navigate(page){if(s.page==='editor'){modal('Leave this draft?',`<p>Your changes have not been saved. You can return to editing or discard the draft.</p><div class="lk-actions">${btn('Keep editing','close-dialog')}${btn('Discard draft','discard-draft','lk-btn-danger',`data-next="${page}"`)}</div>`);return;}s.page=page;render();}
function startRelease(reason){if(['releasing','cleanup','completed'].includes(s.phase))return;s.early=0;s.phase='releasing';s.pendingReason=reason;s.page='focus';render();announce('Releasing simulated restrictions.');setTimeout(()=>{if(s.cleanupFail){s.phase='cleanup';render();announce('Cleanup is pending. Retry or use recovery.');}else finishRelease();},550)}
function finishRelease(){const minutes=Math.round(Math.min(s.snapshot?.duration||s.duration,Math.max(0,(Math.min(now(),s.deadline)-s.start)/60000))*10)/10;const record={name:s.snapshot?.name||current().name,reason:s.pendingReason||'Completed',minutes,at:now(),revision:s.snapshot?.revision||1};s.completion=record;if(s.aggregates)s.history.unshift(record);s.phase='completed';s.page='focus';s.early=0;render();announce('Simulated session released. '+record.reason+'.');}
function openRecovery(){modal('Help & recovery',`<p>${active()?'Recovery ends this simulated session and releases its rules. It remains available in Committed mode.':'No session needs recovery right now. Your apps and browser are unrestricted by this prototype.'}</p><ol><li>Check which component reports a problem.</li><li>Reconnect and retry cleanup if the deadline has passed.</li><li>In the installed app, use the documented local recovery route if restrictions remain.</li></ol>${active()?`<div class="lk-warning">Recovery is for broken behavior or essential access. The outcome is recorded as Recovered.</div><div class="lk-actions">${btn('Keep session','close-dialog')}${btn('Recover this session','confirm-recovery','lk-btn-danger')}</div>`:`<div class="lk-actions">${btn('Close','close-dialog','lk-btn-primary')}</div>`}`)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;
if(b.dataset.page){navigate(b.dataset.page);return;}
if(b.dataset.duration){s.duration=Number(b.dataset.duration);s.custom=false;render();root.querySelector(`[data-duration="${s.duration}"]`)?.focus();return;}
if(b.dataset.section){s.section=b.dataset.section;render();root.querySelector(`[data-section="${s.section}"]`)?.focus();return;}
const a=b.dataset.action;switch(a){
case 'custom-duration':s.custom=true;render();root.querySelector('#lk-custom-minutes').focus();break;
case 'review':if(!validDuration(s.duration))return;{const error=validate(current());if(error){toast(error);return;}s.phase='review';render();announce('Review your session before beginning.');}break;
case 'back-idle':case 'cancel-countdown':s.phase='idle';s.snapshot=null;render();announce('Countdown canceled. No restrictions applied.');break;
case 'begin':{const p=current();if(!s.service||needsBrowser(p)&&!s.browser)return;if(root.querySelector('#lk-ack')&&!root.querySelector('#lk-ack').checked){fieldError('lk-review-error','Confirm that your work is saved before continuing.');root.querySelector('#lk-ack').focus();return;}if(root.querySelector('#lk-commit-ack')&&!root.querySelector('#lk-commit-ack').checked){fieldError('lk-review-error','Confirm that you understand Committed mode.');root.querySelector('#lk-commit-ack').focus();return;}s.snapshot={...clone(p),duration:s.duration,goal:s.goal};s.phase='countdown';s.countdown=now()+10000;render();announce('10-second countdown started.');break;}
case 'advance':if(['countdown','active'].includes(s.phase)){s.virtualOffset+=60000;tick();}break;
case 'finish':if(s.phase==='countdown'){s.virtualOffset+=10000;tick();}else if(s.phase==='active'){s.virtualOffset=Math.max(s.virtualOffset,s.deadline-Date.now()+10);tick();}break;
case 'request-end':if(s.snapshot?.mode==='guided'){s.early=now()+60000;render();announce('Early end requested. 60 seconds remaining.');}break;
case 'cancel-end':s.early=0;render();announce('Early end canceled. Your session continues.');break;
case 'new-session':s.phase='idle';s.snapshot=null;s.goal='';render();break;
case 'open-resources':{const p=s.snapshot||current();modal('Your study resources',`${p.resources.length?`<div class="lk-resource-list">${p.resources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label)} ↗<span class="lk-sr"> (opens a new tab)</span></a>`).join('')}</div>`:'<p>No study links were saved in this session. Add links to your profile for next time.</p>'}<p class="lk-hint">Links open only when selected.</p>`);break;}
case 'edit-basics':case 'edit-apps':case 'edit-sites':case 'edit-youtube':case 'edit-resources':openEditor(a.replace('edit-',''));break;
case 'edit-profile':openEditor('basics',b.dataset.id);break;
case 'use-profile':{const p=profiles.find(x=>x.id===b.dataset.id);s.selected=p.id;s.duration=p.duration;s.custom=![25,45,50,60].includes(p.duration);s.page='focus';render();if(active())toast('Profile selected for your next session. Current rules are unchanged.');break;}
case 'new-profile':s.editor={...clone(base),id:'profile-'+Date.now(),name:'',description:'',apps:[],sites:[],terms:[],resources:[],hideHome:false,hideShorts:false,hideRelated:false,hideEnd:false,noAutoplay:false};s.section='basics';s.page='editor';render();root.querySelector('#lk-name').focus();break;
case 'duplicate':{const p=clone(profiles.find(x=>x.id===b.dataset.id));p.id='profile-'+Date.now();p.name+=' copy';p.revision=1;profiles.push(p);render();toast('Profile duplicated. You can edit its boundaries.');break;}
case 'leave-editor':navigate('profiles');break;
case 'discard-draft':dialog.close();s.editor=null;s.page=b.dataset.next||'profiles';render();break;
case 'save-profile':{const error=validate(s.editor);if(error){const field=!s.editor.name.trim()?'lk-name':!validDuration(s.editor.duration)?'lk-default-duration':s.editor.destination==='custom'&&!safeUrl(s.editor.customUrl)?'lk-custom-url':'lk-approved';s.section=['lk-name','lk-default-duration'].includes(field)?'basics':'youtube';render();fieldError('lk-save-error',error);const input=root.querySelector('#'+field);if(input){const detail=input.closest('details');if(detail)detail.open=true;input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','lk-save-error');input.focus();}return;}const persist=()=>{const idx=profiles.findIndex(x=>x.id===s.editor.id);s.editor.name=s.editor.name.trim();s.editor.duration=Number(s.editor.duration);s.editor.revision=idx<0?1:profiles[idx].revision+1;if(idx<0)profiles.push(clone(s.editor));else profiles[idx]=clone(s.editor);s.selected=s.editor.id;s.duration=s.editor.duration;s.custom=![25,45,50,60].includes(s.duration);s.page='profiles';s.editor=null;render();toast(active()?'Profile saved for next time. Your active session is unchanged.':'Profile saved. Ready for your next session.');};if(!s.editor.apps.length&&!s.editor.sites.length&&!hasYoutube(s.editor)){modal('Save a timer-only profile?',`<p>This profile has no restrictions. It will track session time only.</p><div class="lk-actions">${btn('Keep editing','close-dialog')}${btn('Save timer-only profile','save-empty','lk-btn-primary')}</div>`);s.emptySave=persist;}else persist();break;}
case 'save-empty':dialog.close();s.emptySave?.();s.emptySave=null;break;
case 'add-site':{const inp=root.querySelector('#lk-site-input');let val=inp.value.trim();try{let url=new URL(val.includes('://')?val:'https://'+val);if(!['http:','https:'].includes(url.protocol)||url.username||url.password||!url.hostname.includes('.')||url.pathname!=='/'||url.search||url.hash||url.port||!/^[a-z0-9.-]+$/.test(url.hostname))throw 0;const host=url.hostname.toLowerCase();if(s.editor.sites.some(r=>r.host===host)){fieldError('lk-site-error','That domain is already in this profile.');return;}s.editor.sites.push({host,sub:root.querySelector('#lk-subdomains').checked});render();root.querySelector('#lk-site-input').focus();announce('Website added to draft.');}catch{fieldError('lk-site-error','Enter a domain such as instagram.com. Path rules are outside this prototype.');inp.setAttribute('aria-invalid','true');inp.focus();}break;}
case 'remove-site':case 'remove-resource':case 'remove-term':{const key={'remove-site':'sites','remove-resource':'resources','remove-term':'terms'}[a],idx=Number(b.dataset.index),removed=s.editor[key].splice(idx,1)[0],editId=s.editor.id;render();toast('Removed from this draft.',()=>{if(s.editor?.id===editId){s.editor[key].splice(idx,0,removed);render();}else{toast('This draft is no longer open. Reopen the profile to make changes.');}});break;}
case 'add-term':{let val=root.querySelector('#lk-term-input').value.trim().normalize('NFKC').toLowerCase().replace(/^#/,'');if(!val||s.editor.source==='hashtags'&&!/^[\p{L}\p{N}_]+$/u.test(val)){fieldError('lk-term-error','Enter one hashtag without spaces, or switch to title terms.');return;}if(s.editor.terms.includes(val)){fieldError('lk-term-error','That term is already included.');return;}s.editor.terms.push(val);render();root.querySelector('#lk-term-input').focus();break;}
case 'add-resource':{const label=root.querySelector('#lk-link-label').value.trim(),url=safeUrl(root.querySelector('#lk-link-url').value.trim());if(!label||!url){fieldError('lk-resource-error','Add a label and a valid HTTPS address without embedded credentials.');return;}s.editor.resources.push({label,url});render();root.querySelector('#lk-link-label').focus();announce('Study link added to draft.');break;}
case 'test-rule':testRule();break;
case 'check-connection':s.checking=true;render();setTimeout(()=>{s.checking=false;s.browser=true;s.service=true;s.scenario='ready';root.querySelector('#lk-scenario').value='ready';render();toast('Simulated connection check passed. No real device was contacted.');},650);break;
case 'recovery':openRecovery();break;
case 'confirm-recovery':dialog.close();s.cleanupFail=false;if(s.phase==='cleanup'){s.pendingReason='Recovered';finishRelease();}else if(s.phase==='countdown'){s.phase='idle';s.snapshot=null;render();toast('Countdown canceled. Nothing needed releasing.');}else startRelease('Recovered');break;
case 'retry-cleanup':s.cleanupFail=false;s.phase='releasing';render();setTimeout(finishRelease,550);break;
case 'history-detail':{const h=s.history[Number(b.dataset.index)];modal('Session details',`<dl class="lk-summary"><dt>Profile</dt><dd>${esc(h.name)}</dd><dt>Outcome</dt><dd>${esc(h.reason)}</dd><dt>Elapsed time</dt><dd>${h.minutes} minutes</dd><dt>Rules</dt><dd>Revision ${h.revision}</dd><dt>Data source</dt><dd>Simulation. No real interruption attempts collected.</dd></dl>`);break;}
case 'clear-history':modal('Clear session history?',`<p>This clears ${s.history.length} simulated session entries. Profiles and the active session are kept.</p><div class="lk-actions">${btn('Keep history','close-dialog')}${btn('Clear history','confirm-clear','lk-btn-danger')}</div>`);break;
case 'confirm-clear':{const old=clone(s.history);s.history=[];dialog.close();render();toast('Session history cleared.',()=>{s.history=[...s.history,...old];render();});break;}
case 'close-dialog':dialog.close();break;
case 'undo':{const undo=lastUndo;lastUndo=null;notice.hidden=true;undo?.();announce('Undo applied.');break;}
case 'dismiss-notice':notice.hidden=true;break;
case 'connections':case 'history':case 'focus':navigate(a);break;
}
});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='lk-goal')s.goal=t.value;if(t.id==='lk-custom-minutes'){const valid=validDuration(t.value);const err=root.querySelector('#lk-duration-error');err.hidden=valid;err.textContent=valid?'':'Enter a whole number from 1 to 480.';t.setAttribute('aria-invalid',String(!valid));const start=root.querySelector('[data-action=review]');start.disabled=!valid||!s.service||needsBrowser(current())&&!s.browser;if(valid){s.duration=Number(t.value);root.querySelector('#lk-ticket-minutes').innerHTML=s.duration+'<span>min</span>';root.querySelector('#lk-estimate').textContent=time(now()+s.duration*60000+10000);}}
if(t.id==='lk-app-search'){s.query=t.value;root.querySelector('#lk-app-results').innerHTML=appResults();}
if(t.dataset.edit){let v=t.type==='checkbox'?t.checked:t.value;const k=t.dataset.edit;if(['approved','blocked'].includes(k))v=t.value.split(/\s+/).filter(Boolean);s.editor[k]=v;}
});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='lk-profile'){s.selected=t.value;s.duration=current().duration;s.custom=![25,45,50,60].includes(s.duration);render();root.querySelector('#lk-profile').focus();}
if(t.id==='lk-scenario'){s.scenario=t.value;s.browser=t.value!=='browser';s.service=t.value!=='service';s.cleanupFail=t.value==='cleanup';render();announce('Preview scenario changed.');}
if(t.dataset.app){const id=t.dataset.app;s.editor.apps=t.checked?[...new Set([...s.editor.apps,id])]:s.editor.apps.filter(x=>x!==id);}
if(t.dataset.edit){const k=t.dataset.edit;s.editor[k]=t.type==='checkbox'?t.checked:['approved','blocked'].includes(k)?t.value.split(/\s+/).filter(Boolean):t.value;if(['ytMode','source','destination','tab','unknown'].includes(k)){const id=t.id;render();root.querySelector('#'+id)?.focus();}}
if(t.id==='lk-theme'){root.dataset.theme=t.value;root.style.colorScheme=t.value==='system'?'light dark':t.value;announce('Appearance updated.');}
if(t.id==='lk-motion'){root.dataset.motion=t.value;syncMotion();announce('Motion preference updated.');}
if(t.id==='lk-aggregates'){s.aggregates=t.checked;announce(s.aggregates?'Session summaries enabled.':'New session summaries disabled.');}
});
function testRule(){const p=s.editor,id=root.querySelector('#lk-test-id').value.trim(),title=root.querySelector('#lk-test-title').value.normalize('NFKC').toLowerCase(),tags=root.querySelector('#lk-test-tags').value.normalize('NFKC').toLowerCase().split(/\s+/).map(t=>t.replace(/^#/,'')),missing=root.querySelector('#lk-test-missing').checked;if(!/^[-\w]{11}$/.test(id)){const out=root.querySelector('#lk-test-result');out.hidden=false;out.className='lk-error-box';out.textContent='Enter an 11-character video ID for this sample.';return;}let deny=false,why='No configured term matched this sample.',label='Allowed in this preview';if(p.blocked.includes(id)){deny=true;why='An explicit block on this exact video wins over approval.';}else if(p.approved.includes(id)){why='This exact video is approved; approval overrides broad terms.';}else{const tokens=title.match(/[\p{L}\p{N}_]+/gu)||[],normal= ' '+tokens.join(' ')+' ';const match=missing?null:p.terms.find(term=>p.source==='hashtags'?tags.includes(term):normal.includes(' '+(term.match(/[\p{L}\p{N}_]+/gu)||[]).join(' ')+' '));if(match){deny=true;why=`Matched ${p.source==='hashtags'?'#':''}${match} in ${p.source==='hashtags'?'visible hashtags':'the title'}.`;}else if(p.ytMode==='approved'){deny=true;why='This exact video is not approved. Missing metadata does not grant approval.';}else if(missing){deny=p.unknown==='redirect';why=deny?'Selected metadata is unavailable. Redirect after the timeout.':'Selected metadata is unavailable. Allow with reduced coverage; this is not a clean-content result.';if(!deny)label='Allowed · coverage reduced';}}const out=root.querySelector('#lk-test-result');out.hidden=false;out.className='lk-test-result';out.innerHTML=`<strong>${deny?'Would redirect':label}</strong><p style="margin:6px 0 0">${esc(why)}</p>${deny?`<p style="margin:6px 0 0">Pause → ${esc(destination(p))} ${tabcopy(p)}. Source playback is neutralized.</p>`:''}<p class="lk-hint">Surface controls are independent of this video decision.</p>`;}
function tickDisplay(){let el=root.querySelector('#lk-countdown');if(el){const digit=String(Math.max(0,Math.ceil((s.countdown-now())/1000)));if(el.textContent!==digit){el.textContent=digit;move(el,'digit');}}el=root.querySelector('#lk-timer');if(el)el.textContent=clock((s.deadline-now())/1000);el=root.querySelector('#lk-progress');if(el){const percent=Math.max(0,Math.min(100,(now()-s.start)/(s.deadline-s.start)*100));el.style.width=percent+'%';el.parentElement.setAttribute('aria-valuenow',String(Math.round(percent)));}el=root.querySelector('#lk-early-time');if(el)el.textContent=String(Math.max(0,Math.ceil((s.early-now())/1000)));}
function tick(){if(s.phase==='countdown'&&now()>=s.countdown){if(!s.service||needsBrowser(s.snapshot)&&!s.browser){s.phase='idle';s.snapshot=null;render();toast('Activation canceled because a required connection was lost. No simulated restrictions were applied.');return;}s.start=now();s.deadline=s.start+s.snapshot.duration*60000;s.phase='active';render();announce('Simulated focus session started.');}if(s.phase==='active'){if(now()>=s.deadline)startRelease('Completed');else if(s.early&&now()>=s.early)startRelease('Ended early');}tickDisplay();}
const interval=setInterval(()=>{if(!root.isConnected){clearInterval(interval);return;}tick();},250);
render();
})();
</script>
